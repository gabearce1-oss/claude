version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: research_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pdf_processor:
    build:
      context: .
      dockerfile: Dockerfile.pdf_processor
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/research_db
      LOG_LEVEL: INFO
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      MIN_CHUNK_LENGTH: 50
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./research-db:/app/research-db

  entity_resolver:
    build:
      context: .
      dockerfile: Dockerfile.entity_resolver
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/research_db
      LOG_LEVEL: INFO
      SPACY_MODEL: en_core_web_sm
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./research-db:/app/research-db

volumes:
  postgres_data: